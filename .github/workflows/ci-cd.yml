# CI-CD Full Pipeline — Docker + GitOps

```yaml
name: CI-CD Full Pipeline (Docker + GitOps)

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ==========================================================
  # 1. TEST APPLICATION
  # ==========================================================
  test:
    name: Build & Test Application
    runs-on: self-hosted

    steps:

      # 1️⃣ Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4️⃣ Run lint
      - name: Run Lint
        run: npm run lint

      # 5️⃣ Run tests
      - name: Run Tests
        run: npm test

      # 6️⃣ Build application
      - name: Build Application
        run: npm run build


  # ==========================================================
  # 2. BUILD & PUSH DOCKER IMAGES
  # ==========================================================
  build-push:
    name: Docker Build & Push
    runs-on: self-hosted

    needs: test

    steps:

      # 1️⃣ Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # 2️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Generate short commit SHA
      - name: Set SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 4️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build backend Docker image
      - name: Build Backend Image
        run: |
          docker build \
            -t rituraj4164/backend:${{ env.SHA }} \
            -t rituraj4164/backend:latest \
            ./backend

      # 6️⃣ Build frontend Docker image
      - name: Build Frontend Image
        run: |
          docker build \
            -t rituraj4164/frontend:${{ env.SHA }} \
            -t rituraj4164/frontend:latest \
            ./frontend

      # 7️⃣ Push backend images
      - name: Push Backend Images
        run: |
          docker push rituraj4164/backend:${{ env.SHA }}
          docker push rituraj4164/backend:latest

      # 8️⃣ Push frontend images
      - name: Push Frontend Images
        run: |
          docker push rituraj4164/frontend:${{ env.SHA }}
          docker push rituraj4164/frontend:latest


  # ==========================================================
  # 3. UPDATE GITOPS REPOSITORY
  # ==========================================================
  gitops:
    name: Update GitOps Repository
    runs-on: self-hosted

    needs: build-push

    steps:

      # 1️⃣ Generate short SHA
      - name: Set SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 2️⃣ Clone GitOps repository
      - name: Clone GitOps Repository
        run: |
          rm -rf argocd-github-action

          git clone \
            https://x-access-token:${{ secrets.K8S_REPO_TOKEN }}@github.com/RiturajChaudhary/argocd-github-action.git

      # 3️⃣ Update backend image
      - name: Update Backend Image
        run: |
          sed -i \
            "s|image: rituraj4164/backend:.*|image: rituraj4164/backend:${{ env.SHA }}|g" \
            argocd-github-action/fullstack-deployment.yaml

      # 4️⃣ Update frontend image
      - name: Update Frontend Image
        run: |
          sed -i \
            "s|image: rituraj4164/frontend:.*|image: rituraj4164/frontend:${{ env.SHA }}|g" \
            argocd-github-action/fullstack-deployment.yaml

      # 5️⃣ Commit and push GitOps change
      - name: Commit & Push GitOps Changes
        run: |
          cd argocd-github-action

          git config user.name "Rituraj Chaudhary"
          git config user.email "manojchy4164@gmail.com"

          git add fullstack-deployment.yaml

          if git diff --staged --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "ci: update images to ${{ env.SHA }}"

          git push
```
