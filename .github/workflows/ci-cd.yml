name: CI-CD Full Pipeline (Docker + GitOps)

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt into Node.js 24 ahead of June 2 deadline

jobs:
  build-push-update:
    runs-on: self-hosted   # ← your EC2 Actions Runner
    steps:

      # 1️⃣ Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # 2️⃣ Set up Docker Buildx (≥ 0.17.0 required by docker compose build)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Set short commit SHA
      - name: Set SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 4️⃣ Docker login
      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build images via docker-compose (uses image: fields for tagging)
      - name: Build Images
        run: docker compose build

      # 6️⃣ Tag backend with SHA
      - name: Tag Backend
        run: |
          docker tag rituraj4164/backend:latest \
            rituraj4164/backend:${{ env.SHA }}

      # 7️⃣ Tag frontend with SHA
      - name: Tag Frontend
        run: |
          docker tag rituraj4164/frontend:latest \
            rituraj4164/frontend:${{ env.SHA }}

      # 8️⃣ Push backend (SHA tag + latest)
      - name: Push Backend
        run: |
          docker push rituraj4164/backend:${{ env.SHA }}
          docker push rituraj4164/backend:latest

      # 9️⃣ Push frontend (SHA tag + latest)
      - name: Push Frontend
        run: |
          docker push rituraj4164/frontend:${{ env.SHA }}
          docker push rituraj4164/frontend:latest

      # 🔟 Clone ArgoCD / K8s manifests repo
      - name: Clone K8s Repo
        run: |
          rm -rf argocd-github-action
          git clone https://x-access-token:${{ secrets.K8S_REPO_TOKEN }}@github.com/RiturajChaudhary/argocd-github-action.git

      # 1️⃣1️⃣ Patch image tags in Kubernetes Deployment YAML
      - name: Update Kubernetes YAML
        run: |
          sed -i "s|image: rituraj4164/backend:.*|image: rituraj4164/backend:${{ env.SHA }}|g" \
            argocd-github-action/fullstack-deployment.yaml
          sed -i "s|image: rituraj4164/frontend:.*|image: rituraj4164/frontend:${{ env.SHA }}|g" \
            argocd-github-action/fullstack-deployment.yaml

      # 1️⃣2️⃣ Commit & push only if YAML actually changed
      - name: Push to K8s Repo
        run: |
          cd argocd-github-action
          git config user.name "Rituraj Chaudhary"
          git config user.email "manojchy4164@gmail.com"
          git add .
          git diff --staged --quiet && echo "No changes, skipping push" && exit 0
          git commit -m "ci: update images to ${{ env.SHA }}"
          git push
